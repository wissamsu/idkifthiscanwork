server.port=8081
spring.config.import=optional:file:.env[.properties]
spring.application.name=applier
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.model=qwen/qwen3.8-27b
spring.ai.openai.api-key=${OPENROUTER_API_KEY}

spring.datasource.url=jdbc:postgresql://localhost:5432/applier
spring.datasource.username=wissam
spring.datasource.password=${DB_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.maximum-pool-size=9
spring.datasource.hikari.minimum-idle=4

spring.ai.openai.chat.max-tokens=2000

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/applier
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/applier/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE

spring.security.oauth2.client.registration.keycloak.client-id=applier
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
spring.security.oauth2.client.registration.keycloak.client-name=Keycloak
spring.security.oauth2.client.registration.keycloak.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8080/realms/applier

playwright.test.email=${PLAYWRIGHT_TEST_EMAIL:}
playwright.test.password=${PLAYWRIGHT_TEST_PASSWORD:}

#cloudinary
cloudinary.cloudName=${CLOUDINARY_CLOUD_NAME:}
cloudinary.apiKey=${CLOUDINARY_API_KEY:}
cloudinary.apiSecret=${CLOUDINARY_API_SECRET:}

#selectors
selectors.jobsList=div[data-hook^='job-result-card |']
selectors.quickApplyButton=button[aria-label='Quick apply']
selectors.normalApplyButton=button[type='button'][aria-label='Apply']
selectors.easyApplyResumeUpload=input[type='file']
selectors.numberOfPages=button[type='button'][value]:not([aria-label])
selectors.normalApplyBox=div[data-hook="apply-modal-content"]
selectors.contentBox=[data-hook='apply-modal-content'] form
